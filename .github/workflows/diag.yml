name: Rust diag variant
on: push
jobs:
  diag:
    runs-on: ubuntu-latest
    steps:
      - name: diag
        shell: bash
        run: |
          set +e
          id; echo "--- PATH"; echo "$PATH" | tr ':' '\n'
          echo "--- command -v"; for t in buildkite-agent docker cargo; do echo "$t: $(command -v $t || echo MISSING)"; done
          echo "--- /vendor/docker"; ls -la /vendor/docker 2>&1
          buildkite-agent --version; docker version --format 'client={{.Client.Version}} server={{.Server.Version}}' 2>&1
          docker run --rm hello-world 2>&1 | grep -m1 'Hello from Docker' || echo "docker run FAILED"
      - name: plain cargo build
        shell: bash
        run: |
          cd "$(mktemp -d)" && printf '[package]\nname="diag"\nversion="0.1.0"\nedition="2021"\n' > Cargo.toml && mkdir src && echo 'fn main(){println!("hello-diag");}' > src/main.rs
          cargo --version && cargo build && ./target/debug/diag
